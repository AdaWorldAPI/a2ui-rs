[package]
name = "a2ui-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "a2ui-rs graph lane — the GPU renderer of the node/edge FIELD. Division of labor (operator-ruled 2026-08-14): the FieldView renderer draws the NODE PREVIEW (addressed fields, ClassView x mask) and is the wrong renderer for a graph field, permanently; THIS crate draws the field — instanced SDF rings + indexed line-list edges over wgpu (WebGPU / WebGL2), fed ZERO-COPY from the graph-ABI v3 LE lanes. No SVG in the field; transparent overlay windows above the canvas are the consumer's business."

[lib]
# `cdylib` so `--target wasm32-unknown-unknown` emits a `.wasm` a browser can
# actually load. Without it the browser tier compiles to an rlib and the field
# client is unreachable — something that builds but cannot ship, which is
# worse than something missing, because it looks done.
#
# `rlib` stays alongside it: the pure data path (abi / layout / scene) is a
# normal Rust dependency for native consumers, and `cargo test` needs it.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Instance/vertex buffers are #[repr(C)] Pod structs cast to bytes — the ONE
# sanctioned cast, so the crate stays forbid(unsafe_code).
bytemuck = { version = "1", features = ["derive"] }
# The SIMD polyfill. Operator ruling 2026-08-14: *"wasm is via ndarray
# polyfill"* — the per-frame CPU arithmetic goes through `ndarray::simd`, which
# dispatches to AVX-512 / AVX2 / NEON / **wasm32 SIMD128** / scalar behind ONE
# API. Writing the intrinsics here (or trusting the autovectorizer to find
# them) is the workspace-wide violation the `simd-savant` invariant names:
# consumer crates take their SIMD from `ndarray::simd`, never their own.
#
# `default-features = false` + `std` — the lane types live behind `std`
# (`ndarray/src/lib.rs`: `#[cfg(feature = "std")] pub mod simd`), so `std` is
# the minimum that exposes them; `hpc-extras` stays off because this crate
# wants the polyfill and nothing else, and the wasm build must stay small.
# AdaWorldAPI fork, never crates.io (lance-graph P0). Default branch is
# `master`, not `main`.
ndarray = { git = "https://github.com/AdaWorldAPI/ndarray", branch = "master", default-features = false, features = ["std"] }
# The GPU draw — ON by default (operator, 2026-08-14). See [features].
wgpu = { git = "https://github.com/AdaWorldAPI/wgpu", branch = "trunk", optional = true }

# ── The browser tier — automatic on wasm32, absent everywhere else ──────────
#
# These are NOT optional and NOT feature-gated: they are target-gated. A
# `wasm32` build is a browser build; asking it to also pass `--features web`
# was ceremony that only ever produced the mistake of forgetting it. A native
# build never sees these lines at all, so the "nothing wider" property the
# old comment claimed is now enforced by the target, not by a promise.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# The WebGL2 fallback, always on for wasm32. wgpu tries WebGPU first and
# falls back; without this feature there is no fallback at all, and on the
# machines this tier exists to serve that means no renderer — not a slower
# one. (Operator's assumption, checked: the fallback is not "no worse than
# no wgpu", it is the difference between drawing and not drawing.)
wgpu = { git = "https://github.com/AdaWorldAPI/wgpu", branch = "trunk", optional = true, features = ["webgl"] }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Window",
    "MouseEvent",
    "WheelEvent",
]

[features]
# `wgpu` is default (operator, 2026-08-14). The crate's purpose is to DRAW a
# field; a default that cannot draw made every consumer opt in to the point
# of the crate, and made "it built" a weaker statement than it looked.
#
# The pure data path (ABI view, layout, scene, hit-test, interaction grammar)
# is still device-free and still testable without one — reach it with
# `default-features = false` when a consumer genuinely only wants to parse or
# lay out. That is the honest cost of this flip: `cargo test` now compiles
# wgpu, so a data-path-only contributor pays a slower first build.
default = ["wgpu"]
wgpu = ["dep:wgpu"]
# Kept so existing `--features web` invocations keep working. On wasm32 it is
# now redundant (the browser tier is target-gated above); on native it is
# exactly `wgpu`, because there is no browser to bind to.
web = ["wgpu"]

[dev-dependencies]
# GPU tests block on the async adapter/device request without pulling tokio.
pollster = "0.3"
