<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raindrop on the GPU · Material Laboratory · a2ui</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#f7f4ec;color:#1c1a17;overflow:hidden;font:16px/1.45 Georgia,"Times New Roman",serif}
#page{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#gl{position:absolute;left:0;top:0;touch-action:none;cursor:grab;will-change:transform}
#gl.drag{cursor:grabbing}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#panel{position:fixed;top:12px;right:12px;width:310px;padding:12px 14px;background:rgba(255,255,255,.94);
  border:1px solid #d9d4c7;border-radius:10px;font:13px/1.4 ui-sans-serif,system-ui,sans-serif;max-height:calc(100% - 24px);overflow:auto}
#panel h1{font-size:15px;margin:0 0 4px}
#panel p{margin:0 0 8px;color:#555}
#panel label{display:block;margin:7px 0}
#panel label span{display:flex;justify-content:space-between}
#panel input[type=range],#panel select{width:100%}
#panel .row{display:flex;flex-wrap:wrap;gap:4px 12px}
#readout{font:12px ui-monospace,monospace;white-space:pre-wrap;color:#333}
@media (max-width:600px){#panel{top:auto;bottom:8px;left:8px;right:8px;width:auto;max-height:38%}}
</style>
<body>
<canvas id="page" aria-hidden="true"></canvas>
<canvas id="gl" aria-hidden="true"></canvas>
<div id="text" class="sr"></div>
<form id="panel" onsubmit="return false">
<h1>Raindrop · GPU</h1>
<p id="support">Loading the WebGL2 renderer…</p>
<p>The same droplet as <a href="/lab/optics/drop">the CPU / SVG page</a>, evaluated per pixel by a WebGL2 shader driven from Rust (wasm, no wgpu). The GPU canvas covers only the drop; the page around it is the page itself. A frame is drawn only when something changes.</p>
<label><span>Medium</span><select data-q="medium"><option value="water">Water (n 1.333, V 55.7)</option><option value="glass">Crown glass (n 1.517, V 64.2)</option><option value="diamond">Diamond (n 2.417, V 55.3)</option></select></label>
<label><span>Footprint radius <output data-for="r"></output></span><input data-q="r" type="range" min="20" max="220" value="90"></label>
<label><span>Curvature (apex / radius) <output data-for="curv"></output></span><input data-q="curv" type="range" min="0.05" max="1" step="0.01" value="0.85"></label>
<label><span>Dispersion ×<output data-for="disp"></output></span><input data-q="disp" type="range" min="0" max="30" step="0.5" value="0"><small>0 = off, 1 = physical (Abbe number), above 1 exaggerated</small></label>
<label><span>Key-light angle <output data-for="light"></output></span><input data-q="light" type="range" min="-180" max="180" value="-135"></label>
<div class="row">
<label><input type="checkbox" data-term="refraction" checked> refraction</label>
<label><input type="checkbox" data-term="rim" checked> Fresnel rim</label>
<label><input type="checkbox" data-term="spec" checked> specular</label>
</div>
<div class="row"><button type="button" id="bench">Measure 120 moving frames</button><button type="button" id="parity">GPU vs CPU parity</button></div>
<p id="readout"></p>
</form>
<script type="module">
const $ = (s) => document.querySelector(s);
const canvas = $('#gl'), pageEl = $('#page');
const stats = {};
const show = () => { $('#readout').textContent = Object.entries(stats).map(([k, v]) => k + ': ' + v).join('\n'); };
const fmt = (ms) => ms.toFixed(2) + ' ms';

// printed text over the whole page (drawn once into a 2-D canvas, uploaded as one texture)
const para = 'Light does not merely pass through a drop of water. The curved surface bends every ray toward ' +
  'the centre, so the letters under the drop arrive from a smaller patch of the page and appear larger; ' +
  'near the contact line the surface is steep, the letters stretch and bend, and the rim reflects more ' +
  'of the room than it transmits. Move the drop and watch the same lens slide over new words. ';
$('#text').textContent = para;

function pageCanvas(c, w, h, dpr) {
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = '#f7f4ec'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#1c1a17';
  g.font = (16 * dpr) + 'px Georgia, "Times New Roman", serif';
  g.textBaseline = 'top';
  const pad = 20 * dpr, gap = 28 * dpr, lh = 23 * dpr;
  const cols = Math.max(1, Math.floor((w - 2 * pad + gap) / (268 * dpr)));
  const cw = (w - 2 * pad - (cols - 1) * gap) / cols;
  const words = para.split(' ').filter(Boolean);
  let i = 0;
  for (let col = 0; col < cols; col++) {
    const x = pad + col * (cw + gap);
    for (let y = pad; y + lh < h; y += lh) {
      let line = '';
      for (;;) {
        const next = line ? line + ' ' + words[i % words.length] : words[i % words.length];
        if (line && g.measureText(next).width > cw) break;
        line = next; i++;
      }
      g.fillText(line, x, y);
    }
  }
  return c;
}

const val = (k) => document.querySelector('[data-q="' + k + '"]').value;
const term = (t) => document.querySelector('[data-term="' + t + '"]').checked;

let r, dpr = 1, drop = [0, 0], pending = 0, frames = [];
function frame() {
  pending = 0;
  const ms = r.render(true);
  frames.push(ms); if (frames.length > 120) frames.shift();
  const s = frames.slice().sort((a, b) => a - b);
  stats['last frame (GPU-synced)'] = fmt(ms);
  stats['median, recent frames'] = fmt(s[s.length >> 1]) + ' (' + s.length + ')';
  show();
}
const request = () => { if (!pending) pending = requestAnimationFrame(frame); };

// the GPU canvas is the drop's square, placed where the drop is (integer device pixels)
function place() {
  r.set_drop(drop[0], drop[1]);
  canvas.style.transform = 'translate(' + r.origin_x() / dpr + 'px,' + r.origin_y() / dpr + 'px)';
  request();
}
function size() {
  const side = 2 * Math.ceil(+val('r') * dpr) + 4;
  if (canvas.width !== side) {
    canvas.width = canvas.height = side;
    canvas.style.width = canvas.style.height = side / dpr + 'px';
    stats['GPU canvas'] = side + '×' + side + ' px (' + (side * side / (pageEl.width * pageEl.height) * 100).toFixed(1) + ' % of the page)';
  }
}
function apply() {
  document.querySelectorAll('[data-for]').forEach((o) => { o.textContent = val(o.dataset.for); });
  size();
  r.set_shape(+val('r') * dpr, +val('curv'));
  r.set_medium(val('medium'), +val('disp'));
  r.set_light(+val('light'));
  r.set_terms(term('refraction'), term('rim'), term('spec'));
  stats['centre magnification'] = '×' + r.magnification().toFixed(3);
  place();
}

function resize() {
  dpr = window.devicePixelRatio || 1;
  const w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
  const t0 = performance.now();
  pageCanvas(pageEl, w, h, dpr);
  stats['page text raster (2-D canvas)'] = fmt(performance.now() - t0);
  stats['texture upload'] = fmt(r.set_background(pageEl)) + ', ' + (w * h * 4 / 1048576).toFixed(1) + ' MiB (' + w + '×' + h + ')';
  if (!drop[0]) drop = [Math.round(Math.min(340, innerWidth / 2) * dpr), Math.round(Math.min(260, innerHeight / 3) * dpr)];
  canvas.width = 0;
  apply();
}

let grab = null;
canvas.addEventListener('pointerdown', (e) => {
  const p = [e.clientX * dpr, e.clientY * dpr];
  const rad = +val('r') * dpr;
  if ((p[0] - drop[0]) ** 2 + (p[1] - drop[1]) ** 2 > rad * rad) return;
  grab = [p[0] - drop[0], p[1] - drop[1]];
  canvas.setPointerCapture(e.pointerId); canvas.classList.add('drag');
});
canvas.addEventListener('pointermove', (e) => {
  if (!grab) return;
  drop = [Math.round(e.clientX * dpr - grab[0]), Math.round(e.clientY * dpr - grab[1])];
  place();
});
canvas.addEventListener('pointerup', () => { grab = null; canvas.classList.remove('drag'); });

let timer = 0;
document.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(apply, 30); });
let rt = 0;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 120); });

$('#bench').addEventListener('click', () => {
  const out = [], start = drop.slice();
  const t0 = performance.now();
  for (let k = 0; k < 120; k++) {
    drop = [Math.round(start[0] + 200 * dpr * Math.cos(k / 19)), Math.round(start[1] + 120 * dpr * Math.sin(k / 23))];
    r.set_drop(drop[0], drop[1]);
    out.push(r.render(true));
  }
  const total = performance.now() - t0;
  drop = start; place();
  out.sort((a, b) => a - b);
  // the browser clock may be coarse (100 µs without cross-origin isolation): the mean over
  // the whole run is the reliable number, the per-frame percentiles are bounded by it
  stats['bench 120 moving frames'] = 'mean ' + fmt(total / 120) + ', p95 ' + fmt(out[114]) + ', max ' + fmt(out[119]);
  show();
});
$('#parity').addEventListener('click', () => { stats['parity'] = r.parity(); r.render(true); show(); });

try {
  const t0 = performance.now();
  const mod = await import('/lab/optics/gl/a2ui_optics_gl.js');
  const wasm = await mod.default({ module_or_path: '/lab/optics/gl/a2ui_optics_gl_bg.wasm' });
  const tInit = performance.now() - t0;
  const ent = performance.getEntriesByType('resource').find((x) => x.name.endsWith('_bg.wasm'));
  r = new mod.DropRenderer(canvas);
  stats['wasm'] = ent ? (ent.decodedBodySize / 1024).toFixed(1) + ' KiB (transfer ' + (ent.transferSize / 1024).toFixed(1) + ' KiB)' : 'n/a';
  stats['wasm fetch+compile+instantiate'] = fmt(tInit);
  stats['WebGL2 context + shader compile'] = fmt(r.init_ms);
  stats['wasm linear memory'] = (wasm.memory.buffer.byteLength / 1048576).toFixed(2) + ' MiB';
  $('#support').textContent = 'WebGL2 renderer running.';
  resize();
  cancelAnimationFrame(pending); frame();
  stats['load to first frame'] = fmt(performance.now() - t0);
  show();
  window.__lab = { r, stats };
} catch (e) {
  $('#support').textContent = 'The GPU renderer did not start: ' + e + '. The CPU / SVG page still works.';
  window.__lab = { error: String(e) };
}
</script>
</html>
