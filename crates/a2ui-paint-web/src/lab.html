<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Material Laboratory · a2ui</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.4 ui-sans-serif,system-ui,sans-serif;color:#16202e;overflow:hidden}
body[data-bg=checker]{background:repeating-conic-gradient(#7d8ba3 0 25%,#e9edf2 0 50%) 0 0/32px 32px}
body[data-bg=stripes]{background:repeating-linear-gradient(90deg,#33415a 0 6px,#eef1f5 6px 24px)}
body[data-bg=split]{background:linear-gradient(90deg,#000 50%,#fff 50%)}
body[data-bg=gradient]{background:linear-gradient(135deg,#1d2a44,#9fb4d6 45%,#f4f6fa)}
body[data-bg=rgb]{background:linear-gradient(90deg,#e0102f 0 33%,#10a050 33% 66%,#1050e0 66%)}
body[data-bg=page]{background:#eef1f6}
.page-text{display:none;position:absolute;inset:0;padding:16px 20px;columns:4 240px;column-gap:26px;color:#253041;font-size:15px;line-height:1.45}
.page-text p{margin:0 0 .6em}
body[data-bg=page] .page-text{display:block}
#rear{position:absolute;pointer-events:none;background-size:100% 100%;background-repeat:no-repeat}
#glass{position:absolute;left:120px;top:140px;width:420px;height:200px;border-radius:28px;cursor:grab;touch-action:none;
  background:var(--tint,transparent);-webkit-backdrop-filter:blur(var(--frost,0px));backdrop-filter:blur(var(--frost,0px))}
.lens #glass{-webkit-backdrop-filter:url(#lens);backdrop-filter:url(#lens)}
#spec,#fresnel{position:absolute;inset:0;pointer-events:none;background-size:100% 100%;border-radius:inherit}
#glass .label{position:absolute;left:24px;top:18px;font-weight:600;font-size:20px;pointer-events:none}
#panel{position:fixed;top:0;right:0;bottom:0;width:340px;overflow:auto;padding:14px 16px;background:#fbfcfe;
  border-left:1px solid #d9dee7;font-size:13px}
#panel h1{font-size:15px;margin:0 0 4px}
#panel p{margin:0 0 10px;color:#4a5568}
#panel label{display:block;margin:8px 0}
#panel label span{display:flex;justify-content:space-between}
#panel input[type=range],#panel select{width:100%}
#panel small{display:block;color:#6b7686}
#panel fieldset{border:1px solid #d9dee7;border-radius:8px;margin:10px 0;padding:6px 10px}
#panel .row{display:flex;flex-wrap:wrap;gap:6px}
#panel button{font:inherit;padding:3px 8px;border:1px solid #c6cdd8;border-radius:6px;background:#fff;cursor:pointer}
#readout{font:12px ui-monospace,monospace;color:#334;white-space:pre-wrap}
@media (max-width:720px){#panel{top:auto;width:auto;left:0;height:46%;border-left:0;border-top:1px solid #d9dee7}
  .page-text{columns:2 160px}}
@media (prefers-reduced-transparency:reduce),(prefers-contrast:more),(forced-colors:active){
  #glass,.lens #glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:Canvas}
  #spec,#fresnel,#rear{display:none}}
</style>
<body data-bg="checker">
<div class="page-text"></div>
<div id="rear"></div>
<div id="glass"><div id="fresnel"></div><div id="spec"></div><div class="label">Aqua Glass</div></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<filter id="lens" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
<feImage id="dispmap" x="0" y="0" preserveAspectRatio="none" result="map"/>
<feDisplacementMap id="disp" in="SourceGraphic" in2="map" xChannelSelector="R" yChannelSelector="G" result="ref"/>
<feGaussianBlur id="fine" in="ref" stdDeviation="0" result="f"/>
<feGaussianBlur id="wide" in="ref" stdDeviation="0" result="w"/>
<feComposite id="mix" in="f" in2="w" operator="arithmetic" k1="0" k2="0.336" k3="0.664" k4="0"/>
</filter></defs></svg>
<form id="panel" onsubmit="return false">
<h1>Material Laboratory</h1>
<p><a href="/lab/optics/drop">Raindrop experiment →</a></p>
<p id="support"></p>
<label><span>Background</span><select id="bg">
<option value="checker">Checkerboard (displacement)</option><option value="stripes">Lines (distortion)</option>
<option value="split">Black / white (transmission)</option><option value="gradient">Gradient</option>
<option value="rgb">RGB bands (dispersion)</option><option value="page">Page of text</option></select></label>
<div class="row" id="sizes">
<button type="button" data-size="120x56">Control 56</button><button type="button" data-size="420x200">Card</button>
<button type="button" data-size="900x560">Panel 900</button></div>
<label><span>Effect strength <output data-for="strength"></output></span><input data-q="strength" type="range" min="0" max="1" step="0.01" value="0.53"></label>
<label><span>Hue <output data-for="hue"></output></span><input data-q="hue" type="range" min="0" max="359" value="352"></label>
<div class="row" id="presets">
<button type="button" data-hue="352" data-sat="0.75">Ruby</button><button type="button" data-hue="212" data-sat="0.80">Ocean</button>
<button type="button" data-hue="158" data-sat="0.55">Mint</button><button type="button" data-hue="45" data-sat="0.70">Vanilla</button>
<button type="button" data-hue="0" data-sat="0">Neutral</button></div>
<fieldset><legend>Terms (ablation)</legend><div class="row">
<label><input type="checkbox" data-term="refraction" checked> refraction</label>
<label><input type="checkbox" data-term="fresnel" checked> Fresnel</label>
<label><input type="checkbox" data-term="rim" checked> specular</label>
<label><input type="checkbox" data-term="fine" checked> fine scatter</label>
<label><input type="checkbox" data-term="wide" checked> wide scatter</label>
<label><input type="checkbox" data-term="rear"> rear light</label>
<label><input type="checkbox" data-term="tint" checked> tint</label></div>
<div class="row" id="stages">
<button type="button" data-stage="1" title="refraction only">1</button><button type="button" data-stage="2" title="+ Fresnel">2</button>
<button type="button" data-stage="3" title="+ directional specular">3</button><button type="button" data-stage="4" title="+ fine scattering">4</button>
<button type="button" data-stage="5" title="+ wide scattering">5</button><button type="button" data-stage="6" title="+ rear light">6</button>
<button type="button" data-stage="7" title="+ suspension and dispersion (not implemented on the card yet)">7</button></div>
<small>Stages: 1 refraction · 2 +Fresnel · 3 +specular · 4 +fine scatter · 5 +wide scatter · 6 +rear light · 7 +suspension/dispersion (card: not implemented yet)</small></fieldset>
<details><summary>Expert</summary>
<label><span>Width <output data-for="w"></output></span><input data-q="w" type="range" min="40" max="1200" value="420"></label>
<label><span>Height <output data-for="h"></output></span><input data-q="h" type="range" min="40" max="900" value="200"></label>
<label><span>Corner radius <output data-for="radius"></output></span><input data-q="radius" type="range" min="4" max="160" value="28"></label>
<label><span>Profile</span><select data-q="profile"><option value="squircle">convex squircle</option><option value="circle">convex circle</option></select></label>
<label><span>Bevel width <output data-for="bezel"></output></span><input data-q="bezel" type="range" min="4" max="80" value="17"><small>measured (shayann07): 0.6 × corner radius</small></label>
<label><span>Thickness <output data-for="thickness"></output></span><input data-q="thickness" type="range" min="2" max="60" value="16"><small>authored (shayann07, clear): 16</small></label>
<label><span>Depth to back face <output data-for="depth"></output></span><input data-q="depth" type="range" min="0" max="60" value="8"></label>
<label><span>Refractive index <output data-for="ior"></output></span><input data-q="ior" type="range" min="1" max="2" step="0.01" value="1.5"><small>authored: 1.5 (all sources)</small></label>
<label><span>Refraction <output data-for="refraction"></output></span><input data-q="refraction" type="range" min="0" max="2" step="0.05" value="1"></label>
<label><span>Fine scattering σ <output data-for="fine"></output></span><input data-q="fine" type="range" min="0" max="4" step="0.025" value="0.875"><small>measured (shayann07): 0.875</small></label>
<label><span>Wide scattering σ <output data-for="wide"></output></span><input data-q="wide" type="range" min="0" max="30" step="0.5" value="10"><small>measured (shayann07): 10</small></label>
<label><span>Fine share <output data-for="share"></output></span><input data-q="share" type="range" min="0" max="1" step="0.01" value="0.336"><small>measured (shayann07): 0.336</small></label>
<label><span>Key-light angle <output data-for="light"></output></span><input data-q="light" type="range" min="-180" max="180" value="-110"><small>authored (shayann07): (−0.35, −0.94) ≈ −110°</small></label>
<label><span>Rim exponent <output data-for="specexp"></output></span><input data-q="specexp" type="range" min="1" max="16" value="6"><small>measured (shayann07): 6</small></label>
<label><span>Rim opacity <output data-for="specop"></output></span><input data-q="specop" type="range" min="0" max="1" step="0.01" value="0.35"></label>
<label><span>Rear-light intensity <output data-for="halo"></output></span><input data-q="halo" type="range" min="0" max="1" step="0.01" value="0.45"></label>
<label><span>Rear-light saturation <output data-for="sat"></output></span><input data-q="sat" type="range" min="0" max="1" step="0.01" value="0.75"></label>
<label><span>Body tint (opacity at full strength)</span><select data-q="tint"><option value="0.565">regular: grey 241 at 56.5 % (measured, shayann07)</option>
<option value="0.04">clear: 4 % (authored, shayann07; shown in grey 241)</option></select></label>
</details>
<p id="readout"></p>
</form>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var glass = $('#glass'), spec = $('#spec'), rear = $('#rear');
  var lens = CSS.supports('backdrop-filter', 'url(#a)') &&
    !!(navigator.userAgentData && navigator.userAgentData.brands.some(function (b) { return /Chrom/.test(b.brand); }));
  document.body.classList.toggle('lens', lens);
  $('#support').textContent = lens
    ? 'Chromium: real refraction (SVG filter as backdrop-filter).'
    : 'No SVG backdrop-filter here: frosted fallback (blur), no refraction.';

  function val(k) { var el = document.querySelector('[data-q="' + k + '"]'); return el ? el.value : ''; }
  function term(t) { return document.querySelector('[data-term="' + t + '"]').checked; }
  // What each server resource depends on (a2ui_paint::optics docs). A map is fetched again
  // only when one of its own inputs changed: a colour change refetches the rear light alone.
  var DEPS = {
    params: ['profile', 'bezel', 'thickness', 'depth', 'ior', 'refraction', 'fine', 'wide', 'share', 'tint', 'strength'],
    disp: ['w', 'h', 'radius', 'profile', 'bezel', 'thickness', 'depth', 'ior'],
    spec: ['w', 'h', 'radius', 'profile', 'bezel', 'thickness', 'ior', 'light', 'specexp', 'specop', 'strength'],
    fresnel: ['w', 'h', 'radius', 'profile', 'bezel', 'thickness', 'ior', 'strength'],
    rear: ['hue', 'sat', 'halo', 'strength']
  };
  function url(kind, extra) {
    var p = DEPS[kind].map(function (k) { return k + '=' + encodeURIComponent(val(k)); });
    if (kind !== 'params') p.unshift('kind=' + kind);
    return (kind === 'params' ? '/lab/optics/params' : '/lab/optics/map') + '?' + p.concat(extra || []).join('&');
  }
  var slot = {};   // per resource: { want: url, have: url, ctrl: AbortController }
  var stats = { fetched: 0, skipped: 0 };
  function load(kind, u, apply) {
    var s = slot[kind] || (slot[kind] = {});
    s.want = u;
    if (s.have === u) { stats.skipped++; return; }
    if (s.ctrl) s.ctrl.abort();
    var ctrl = s.ctrl = new AbortController();
    stats.fetched++;
    fetch(u, { signal: ctrl.signal }).then(function (r) {
      if (!r.ok) throw new Error(kind + ': HTTP ' + r.status);
      return (kind === 'params' ? Promise.resolve(null) : r.blob()).then(function (b) {
        if (s.want !== u) return;               // superseded while in flight
        var obj = b ? URL.createObjectURL(b) : null;
        if (s.obj) URL.revokeObjectURL(s.obj);
        s.obj = obj; s.have = u; s.h = r.headers;
        apply(obj, r.headers);
        readout();
      });
    }).catch(function (e) { if (e.name !== 'AbortError') $('#readout').textContent = String(e); });
  }
  function h(kind, name) { return slot[kind] && slot[kind].h ? slot[kind].h.get(name) : '–'; }
  function readout() {
    $('#readout').textContent =
      'max displacement ' + h('params', 'x-a2ui-max-displacement') + ' px · filter scale ' + h('params', 'x-a2ui-filter-scale') +
      '\nF0 ' + h('params', 'x-a2ui-f0') + ' · element ' + val('w') + '×' + val('h') + ' px' +
      '\ncompute µs (render + png): displacement ' + h('disp', 'x-a2ui-render-us') + ' + ' + h('disp', 'x-a2ui-encode-us') +
      ', rim ' + h('spec', 'x-a2ui-render-us') + ' + ' + h('spec', 'x-a2ui-encode-us') +
      ', rear ' + h('rear', 'x-a2ui-render-us') + ' + ' + h('rear', 'x-a2ui-encode-us') + ' (' + h('rear', 'x-a2ui-size') + ')' +
      '\nrequests: ' + stats.fetched + ' fetched, ' + stats.skipped + ' kept from cache';
  }
  function applyParams() {
    var p = slot.params && slot.params.h; if (!p) return;
    $('#disp').setAttribute('scale', term('refraction') ? p.get('x-a2ui-filter-scale') : '0');
    var fine = term('fine'), wide = term('wide'), sc = fine || wide;
    $('#fine').setAttribute('stdDeviation', fine ? p.get('x-a2ui-filter-fine') : '0');
    $('#wide').setAttribute('stdDeviation', wide ? p.get('x-a2ui-filter-wide') : '0');
    // one kernel alone carries the whole weight; both mix by the fine share
    var share = fine && wide ? +p.get('x-a2ui-filter-share') : (fine ? 1 : 0);
    if (!sc) share = 1;
    $('#mix').setAttribute('k2', String(share)); $('#mix').setAttribute('k3', String(1 - share));
    // the body tint scales with strength like every other term (engine: FilterParams::tint_alpha)
    // fallback without SVG backdrop filters: frost by the wide scattering σ, so it too is 0 at strength 0
    glass.style.setProperty('--frost', (wide ? p.get('x-a2ui-filter-wide') : (fine ? p.get('x-a2ui-filter-fine') : '0')) + 'px');
    glass.style.setProperty('--tint', term('tint') ? 'rgb(241 241 241 / ' + p.get('x-a2ui-filter-tint') + ')' : 'transparent');
  }
  function placeRear() {
    var w = glass.offsetWidth, h = glass.offsetHeight, m = Math.round(0.6 * Math.min(w, h)) + 40;
    rear.style.left = (glass.offsetLeft - m) + 'px'; rear.style.top = (glass.offsetTop - m) + 'px';
    rear.style.width = (w + 2 * m) + 'px'; rear.style.height = (h + 2 * m) + 'px';
    return [w + 2 * m, h + 2 * m];
  }
  function build() {
    document.querySelectorAll('[data-for]').forEach(function (o) { o.textContent = val(o.dataset.for); });
    var w = +val('w'), hh = +val('h');
    glass.style.width = w + 'px'; glass.style.height = hh + 'px';
    glass.style.borderRadius = Math.min(+val('radius'), w / 2, hh / 2) + 'px';
    spec.style.display = term('rim') ? '' : 'none';
    $('#fresnel').style.display = term('fresnel') ? '' : 'none';
    rear.style.display = term('rear') ? '' : 'none';
    var box = placeRear();
    applyParams();
    load('params', url('params'), applyParams);
    load('disp', url('disp'), function (obj) {
      var d = $('#dispmap');
      d.setAttribute('href', obj); d.setAttribute('width', w); d.setAttribute('height', hh);
    });
    load('spec', url('spec'), function (obj) { spec.style.backgroundImage = 'url(' + obj + ')'; });
    load('fresnel', url('fresnel'), function (obj) { $('#fresnel').style.backgroundImage = 'url(' + obj + ')'; });
    // the rear field is smooth, so it is rendered at half resolution and scaled up
    load('rear', url('rear', ['w=' + Math.ceil(box[0] / 2), 'h=' + Math.ceil(box[1] / 2)]),
      function (obj) { rear.style.backgroundImage = 'url(' + obj + ')'; });
    readout();
  }
  var timer = 0;
  function later() { clearTimeout(timer); timer = setTimeout(build, 60); }
  document.addEventListener('input', function (e) {
    if (e.target.id === 'bg') { document.body.dataset.bg = e.target.value; return; }
    later();
  });
  $('#sizes').addEventListener('click', function (e) {
    var s = e.target.dataset.size; if (!s) return;
    var wh = s.split('x');
    document.querySelector('[data-q="w"]').value = wh[0]; document.querySelector('[data-q="h"]').value = wh[1];
    build();
  });
  $('#presets').addEventListener('click', function (e) {
    var b = e.target; if (!b.dataset.hue) return;
    document.querySelector('[data-q="hue"]').value = b.dataset.hue;
    document.querySelector('[data-q="sat"]').value = b.dataset.sat;
    document.querySelector('[data-term="rear"]').checked = +b.dataset.sat > 0;
    build();
  });
  var STAGES = ['refraction', 'fresnel', 'rim', 'fine', 'wide', 'rear', 'tint'];
  $('#stages').addEventListener('click', function (e) {
    var n = +e.target.dataset.stage; if (!n) return;
    // each stage adds one mechanism to the previous one; the tint arrives with scattering
    var on = { refraction: n >= 1, fresnel: n >= 2, rim: n >= 3, fine: n >= 4, wide: n >= 5, rear: n >= 6, tint: n >= 4 };
    STAGES.forEach(function (t) { document.querySelector('[data-term="' + t + '"]').checked = on[t]; });
    build();
  });
  // printed text over the whole page, so lines cross every optical boundary and the interior
  (function () {
    var para = 'Glass is judged against something behind it. A checkerboard shows displacement, lines show ' +
      'distortion, black and white show transmission and coloured bands show dispersion; this text shows ' +
      'how readable a page stays under the material and how the bevel bends the letters that cross it. ' +
      'Every map on the element is computed by the a2ui-paint optics engine; the page only asks for it. ';
    var h = ''; for (var i = 0; i < 70; i++) h += '<p>' + para + '</p>';
    document.querySelector('.page-text').innerHTML = h;
  })();
  var drag = null;
  glass.addEventListener('pointerdown', function (e) { drag = [e.clientX - glass.offsetLeft, e.clientY - glass.offsetTop]; glass.setPointerCapture(e.pointerId); });
  glass.addEventListener('pointermove', function (e) {
    if (!drag) return;
    glass.style.left = (e.clientX - drag[0]) + 'px'; glass.style.top = (e.clientY - drag[1]) + 'px';
    placeRear();
  });
  glass.addEventListener('pointerup', function () { drag = null; });
  build();
})();
</script>
</html>
