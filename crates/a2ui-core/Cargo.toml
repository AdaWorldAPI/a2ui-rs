[package]
name = "a2ui-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "The a2ui-rs render-target core: consumes ogar-a2ui-frame (the addressed-surface LE wire) and will grow the W2 service shape (RenderStream / ActionStream / codebook sync) per AdaWorldAPI/OGAR docs/A2UI-SCREEN-ADDRESSING-PROPOSAL.md."

[dependencies]
# The W1 addressed-surface frames (OGAR). Flipped to `branch = "main"` now
# that OGAR #206 has merged — the workspace's float-then-flip pattern
# (spider_doc_ir precedent). Drift protection is the smoke test below.
ogar-a2ui-frame = { git = "https://github.com/AdaWorldAPI/OGAR", branch = "main" }

[features]
default = []
# Membrane-only: forwards ogar-a2ui-frame's serde derives so an edge adapter
# (e.g. a2ui-server's `json` feature) can (de)serialize frames for a non-wasm
# client. NEVER the hot path (the hot path is LE bytes end-to-end, charter T3).
serde = ["ogar-a2ui-frame/serde"]
