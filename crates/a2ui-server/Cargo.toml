[package]
name = "a2ui-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "a2ui-rs W2 service tier — the graph desktop projection: RBAC-project a class surface (WideFieldMask ∩ role, fail-closed) BEFORE framing, emit NodeDelta frames down + an askama fieldview surface, resolve ActionInvoke frames up by ordinal address, and carry it all over an ogar-encryption sealed session transport. Per AdaWorldAPI/OGAR docs/A2UI-SCREEN-ADDRESSING-PROPOSAL.md (W2/W5)."

[dependencies]
# The W1 addressed-surface frames (re-exported by a2ui-core).
a2ui-core = { path = "../a2ui-core" }
# The RBAC mask + the ClassView projection surface (WideFieldMask, ClassView,
# ValueRow/RenderRow). lance-graph main.
lance-graph-contract = { git = "https://github.com/AdaWorldAPI/lance-graph", branch = "main" }
# The askama fieldview render brick (W2/W3 render half). On `main` since the
# OGAR render PR (#207) merged — the float-then-flip pattern completed.
ogar-render-askama = { git = "https://github.com/AdaWorldAPI/OGAR", branch = "main" }
# The single generic crypto surface (Argon2id KDF + XChaCha20-Poly1305 AEAD)
# for the rdp-2graph sealed session transport (charter C1.5, W5). No new crypto.
ogar-encryption = { git = "https://github.com/AdaWorldAPI/OGAR", branch = "main" }
# Platform CSPRNG for the fresh per-session salt (Session::establish_random_salt)
# — the SAME entropy source ogar-encryption's envelope uses (OS getrandom); not
# a crypto primitive, just entropy access. Makes the nonce-safe path the easy one.
getrandom = "0.2"
# JSON membrane (edge-only, feature `json`). NEVER on the hot path.
serde_json = { version = "1.0", optional = true }
# The OGAR IR type the #209 Klickwege lowering targets (ActionInvocation +
# ActionSubject). PROMOTED dev→normal (warden contingency): lower_action_fire is
# a plain compile-time value-construction fn, so a2ui-server (consumer) builds an
# ALREADY-MINTED OGAR type — no IR minting here (that stays OGAR-side).
ogar-vocab = { git = "https://github.com/AdaWorldAPI/OGAR", branch = "main" }

[features]
default = []
# Membrane adapter: enables a2ui-core's serde forward + serde_json so a non-wasm
# client can (de)serialize frames as JSON at the EDGE (charter C1.2). The
# server→wasm hot path is LE + AEAD and never touches this (T3).
json = ["a2ui-core/serde", "dep:serde_json"]

[dev-dependencies]
# ogar-vocab is a normal dependency now (the #209 lowering uses it in non-test
# builds); the P-REHOST-lite test (Class + ActionDef) shares that one source.
# The build-time codegen arm (the ruff-codegen DO-arm → askama struct-of-methods).
ogar-render-askama = { git = "https://github.com/AdaWorldAPI/OGAR", branch = "main" }
# For the test's ClassView impl (FieldRef, DisplayTemplate) — unifies with the
# normal dep (same git main source).
lance-graph-contract = { git = "https://github.com/AdaWorldAPI/lance-graph", branch = "main" }
